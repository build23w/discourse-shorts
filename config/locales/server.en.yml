en:
  site_settings:
    shorts_enabled: "Enable the discourse-shorts library."
    shorts_recycle_enabled: "Recycle (delete) stale auto-ingested shorts when the library is over capacity. Only never-engaged, auto-ingested shorts past the grace window are ever deleted — uploads, member submissions and anything with a like/comment/share are permanent. Turn off to never delete anything."
    shorts_ingest_per_run: "How many fresh shorts the 6-hour ingest job pulls per run."
    shorts_recycle_min_keep: "Recycling never shrinks the library below this many approved shorts."
    shorts_recycle_max_per_run: "Hard cap on deletions per recycling run (prevents mass purges)."
    shorts_recycle_grace_hours: "A short must be at least this many hours old (and untouched) before it can be recycled."
    shorts_allow_member_submissions: "Allow non-staff members to submit shorts (staff can always submit)."
    shorts_min_submit_trust_level: "Minimum trust level a member needs to submit shorts (when member submissions are enabled)."
    shorts_auto_approve_trust_level: "Submissions from users at or above this trust level are auto-approved."
    shorts_max_library: "Stop auto-ingesting once the approved library reaches this size (0 = unlimited)."
    shorts_ingest_enabled: "Run the scheduled YouTube auto-ingest job."
    shorts_youtube_api_key: "YouTube Data API v3 key (server-side, used only for auto-ingest)."
    shorts_ingest_terms: "Search terms the auto-ingest job pulls shorts for."
    shorts_reward_enabled: "Pay the author $RENO when other members like their short (mirrors post-upvote rewards)."
    shorts_like_reward_amount: "$RENO granted to a short's author per eligible like."
    shorts_reward_min_trust_level: "Minimum trust level a liker needs for their like to pay the author."
    shorts_reward_daily_cap_per_short: "Max $RENO a single short can earn its author per day."
    shorts_reward_daily_cap_per_author: "Max $RENO one author can earn from shorts likes per day."
    shorts_comments_enabled: "Allow members to comment on shorts (first comment auto-creates a discussion topic)."
    shorts_comment_category_id: "Category where short discussion topics are created (0 = auto-detect the 'shorts' category)."
    shorts_owned_priority: "Gentle ranking boost for LF-produced (owned) videos so they stay in rotation without dominating."
