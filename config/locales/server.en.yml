en:
  site_settings:
    shorts_enabled: "Enable the discourse-shorts library."
    shorts_recycle_enabled: "Recycle (delete) stale auto-ingested shorts when the library is over capacity. Only never-engaged, auto-ingested shorts past the grace window are ever deleted — uploads, member submissions and anything with a like/comment/share are permanent. Turn off to never delete anything."
    shorts_ingest_per_run: "How many fresh shorts the 6-hour ingest job pulls per run."
    shorts_recycle_min_keep: "Recycling never shrinks the library below this many approved shorts."
    shorts_recycle_max_per_run: "Hard cap on deletions per recycling run (prevents mass purges)."
    shorts_recycle_grace_hours: "A short must be at least this many hours old (and untouched) before it can be recycled."
    shorts_allow_member_submissions: "Allow non-staff members to submit shorts (staff can always submit)."
    shorts_min_submit_trust_level: "Minimum trust level a member needs to submit shorts (when member submissions are enabled)."
    shorts_auto_approve_trust_level: "Submissions from users at or above this trust level are auto-approved."
    shorts_max_library: "Stop auto-ingesting once the approved library reaches this size (0 = unlimited)."
    shorts_ingest_enabled: "Run the scheduled YouTube auto-ingest job."
    shorts_youtube_api_key: "YouTube Data API v3 key (server-side, used only for auto-ingest)."
    shorts_ingest_terms: "Search terms the auto-ingest job pulls shorts for."
    shorts_reward_enabled: "Pay the author $RENO when other members like their short (mirrors post-upvote rewards)."
    shorts_like_reward_amount: "$RENO granted to a short's author per eligible like."
    shorts_reward_min_trust_level: "Minimum trust level a liker needs for their like to pay the author."
    shorts_reward_daily_cap_per_short: "Max $RENO a single short can earn its author per day."
    shorts_reward_daily_cap_per_author: "Max $RENO one author can earn from shorts likes per day."
    shorts_comments_enabled: "Allow members to comment on shorts (first comment auto-creates a discussion topic)."
    shorts_comment_category_id: "Category where short discussion topics are created (0 = auto-detect the 'shorts' category)."
    shorts_owned_priority: "Gentle ranking boost for LF-produced (owned) videos so they stay in rotation without dominating."
    shorts_recommender_enabled: "Personalize each member's shorts lineup (liked-tag affinity + location + followed creators) on top of the shared pool."
    shorts_cloudflare_enabled: "CLOUDFLARED MODE: serve shorts videos/posters from the Cloudflare R2 media CDN (read-time URL remap; off = instant rollback to the upload store)."
    shorts_cloudflare_base_url: "Public base URL of the R2 custom domain (e.g. https://media.renovation.reviews). Must be https."
    shorts_cloudflare_rewrite_hosts: "Upload-store hosts whose URLs get remapped onto the CDN base (path preserved - the bucket mirrors the store layout)."
    shorts_cloudflare_mirror_uploads: "Mirror new creator uploads (video + poster) into the R2 bucket asynchronously so the CDN remap covers them."
    shorts_cloudflare_s3_endpoint: "R2 S3 API endpoint (https://<account-id>.r2.cloudflarestorage.com). Server-side, used only for mirroring."
    shorts_cloudflare_s3_bucket: "R2 bucket name holding shorts media."
    shorts_cloudflare_s3_access_key_id: "R2 S3 access key id (write access to the media bucket)."
    shorts_cloudflare_s3_secret_access_key: "R2 S3 secret access key."
    hrr_desk_enabled: "HRR desk: run the server-side content jobs (daily topic, answer desk, refresh desk, shirt ideas). Needs hrr_desk_ai_token."
    hrr_desk_ai_account: "Cloudflare account id whose Workers AI the desk calls."
    hrr_desk_ai_token: "Cloudflare API token with Workers AI (Read) on that account. Server-side only; never shown."
    hrr_desk_ai_model: "Workers AI model id for the desk's writing."
    hrr_desk_max_ai_calls_per_day: "Hard daily cap on model calls across every desk job (0 = the desk never calls the model)."
    hrr_desk_poster: "Username the desk posts as (the house 'Contractor' account)."
    hrr_desk_house_users: "House accounts whose topics the answer desk never treats as member questions."
    hrr_desk_skip_categories: "Category ids the answer/refresh desks never touch (shorts, staff, promo, ...)."
    hrr_desk_topic_categories: "Category ids the daily topic may be filed in."
    hrr_desk_promo_category_id: "Category promo/spam topics are moved to when the answer desk unlists them (reversible)."
    hrr_desk_staff_category_id: "Staff category for the desk's run log and the Shirt Lab ideas topic."
    hrr_desk_faq_post_id: "Post id of the pinned FAQ that carries the crew-answers index block (0 = off)."
    hrr_desk_log_topic_id: "Topic the desk posts its run log into (0 = create one in the staff category on first use)."
    hrr_desk_indexnow_key: "IndexNow key (the Worker must serve /<key>.txt for pings to count)."
    hrr_desk_daily_topic_enabled: "Post one researched topic a day as the poster account."
    hrr_desk_daily_topic_hour_utc: "UTC hour after which the daily topic is posted (once per day)."
    hrr_desk_answer_enabled: "Every 3 hours, reply to unanswered member threads (and unlist obvious promo)."
    hrr_desk_answer_max_per_run: "Max replies/unlists per answer-desk run."
    hrr_desk_refresh_enabled: "On the refresh weekdays, post dated updates to threads that earn search clicks."
    hrr_desk_refresh_weekdays: "Weekdays (0 = Sunday .. 6 = Saturday) the refresh desk runs."
    hrr_desk_refresh_hour_utc: "UTC hour after which the refresh desk runs (once per day)."
    hrr_desk_weekly_report_enabled: "Post the Monday growth report (vs the 2026-08-31 baseline) into the desk log topic."
    hrr_shirt_feed_enabled: "Refresh the Shirt Lab carousel feed from shirtlab.lol every 6 hours (served at /shorts/shirt-feed.json)."
    hrr_shirt_lab_url: "Shirt Lab origin."
    hrr_shirt_ideas_enabled: "Mondays: propose the next Shirt Lab batch into the private staff ideas topic (needs the desk AI token)."
    hrr_shirt_ideas_topic_id: "Staff topic that holds the curator's batch proposals (0 = create on first run)."
    hrr_discord_feed_enabled: "Post new forum topics to Discord (webhooks below), routed by category."
    hrr_discord_webhook_new_topics: "Discord webhook URL for new topics (default channel)."
    hrr_discord_webhook_jobs: "Discord webhook URL for the job board categories."
    hrr_discord_webhook_reviews: "Discord webhook URL for contractor reviews."
    hrr_discord_job_categories: "Category ids routed to the jobs webhook."
    hrr_discord_review_categories: "Category ids routed to the reviews webhook."
    hrr_discord_feed_skip_categories: "Category ids never posted to Discord."
    hrr_discord_bot_token: "Discord bot token for the #ask-the-pros porter and role sync. Server-side only."
    hrr_discord_guild_id: "Discord server (guild) id."
    hrr_discord_ask_channel_id: "Discord forum channel id whose threads staff can pin (📌) for porting."
    hrr_discord_port_enabled: "Hourly: port staff-pinned #ask-the-pros threads to the forum after the author reacts ✅ to the consent message."
    hrr_discord_port_category_id: "Forum category ported Discord threads are posted in."
    hrr_discord_roles_enabled: "Daily: grant Reno Insider / Verified Reviewer Discord roles from forum standing (link topic claims)."
    hrr_discord_link_topic_id: "Forum topic where members post their Discord handle to link accounts."
    hrr_discord_insider_top_n: "Leaderboard rank at or above which a linked member gets the Reno Insider role."
