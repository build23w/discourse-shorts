plugins:
  shorts_enabled:
    default: true
    client: true
  shorts_allow_member_submissions:
    default: true
    client: true
  shorts_min_submit_trust_level:
    default: 3
    enum: "TrustLevelSetting"
  shorts_auto_approve_trust_level:
    default: 3
    enum: "TrustLevelSetting"
  shorts_max_library:
    default: 2000
    min: 0
    max: 100000
  shorts_ingest_enabled:
    default: false
  shorts_youtube_api_key:
    default: ""
    secret: true
  shorts_ingest_terms:
    type: list
    list_type: simple
    default: "home renovation shorts|kitchen remodel shorts|bathroom remodel shorts|diy renovation tips shorts|how to drywall shorts|plumbing tips shorts|tile installation shorts|painting tips shorts|flooring install shorts|deck building shorts|kitchen cabinet install shorts|countertop install shorts|electrical tips homeowner shorts|framing tips shorts|concrete finishing shorts|interlock paver install shorts|renovation mistakes shorts|before after renovation shorts|caulking grout tips shorts|basement waterproofing shorts|window replacement shorts|door installation shorts|roofing repair shorts|siding installation shorts|fence building shorts|insulation install shorts|smart home upgrades shorts|trim carpentry shorts|landscaping ideas shorts|gutter cleaning shorts|heat pump installation shorts|stair renovation shorts|power tool tips shorts|garage organization shorts"
  # --- $RENO payouts for shorts engagement (mirrors the post-vote reward model) ---
  shorts_reward_enabled:
    default: true
  shorts_like_reward_amount:
    default: 2
    min: 0
    max: 1000
  shorts_reward_min_trust_level:
    default: 1
    enum: "TrustLevelSetting"
  shorts_reward_daily_cap_per_short:
    default: 50
    min: 0
    max: 100000
  shorts_reward_daily_cap_per_author:
    default: 200
    min: 0
    max: 100000
  # --- comment -> auto-topic ---
  shorts_comments_enabled:
    default: true
    client: true
  shorts_comment_category_id:
    default: 0
  # --- gentle algorithmic precedence for LF-owned videos (source="owned") ---
  shorts_owned_priority:
    default: 10
    min: 0
    max: 100
  # --- the lovely learning engine (per-user journey ordering of /shorts.json) ---
  shorts_journey_enabled:
    default: true
    client: true
  shorts_complete_seconds:
    default: 20
    min: 5
    max: 600
  # --- learn-and-earn: immediate $RENO when a learner COMPLETES a short ---
  shorts_lesson_reward_amount:
    default: 5
    min: 0
    max: 1000
  shorts_lesson_daily_cap:
    default: 5
    min: 0
    max: 100
  # --- recycling/deletion of stale auto-ingested shorts (v0.3.2: configurable) ---
  # Master switch. When off, nothing is ever deleted; the library grows to
  # shorts_max_library and ingest simply stops adding once full.
  shorts_recycle_enabled:
    default: true
  # Fresh shorts pulled per 6-hour ingest run.
  shorts_ingest_per_run:
    default: 24
    min: 0
    max: 200
  # Recycling never shrinks the library below this many approved shorts.
  shorts_recycle_min_keep:
    default: 100
    min: 0
    max: 100000
  # Hard cap on deletions per run -- never a mass purge.
  shorts_recycle_max_per_run:
    default: 24
    min: 0
    max: 500
  # A short must live this many hours (untouched) before it can be recycled.
  shorts_recycle_grace_hours:
    default: 48
    min: 1
    max: 8760
  # --- Creator Studio: direct <=60s video uploads (group-gated) ---
  shorts_creator_uploads_enabled:
    default: true
    client: true
  shorts_creator_groups:
    type: group_list
    default: ""
    client: true
  shorts_creator_max_seconds:
    default: 60
    min: 5
    max: 300
  shorts_creator_max_mb:
    default: 100
    min: 1
    max: 1024
  shorts_creator_daily_cap:
    default: 5
    min: 1
    max: 100
  shorts_recommender_enabled:
    default: true
  # --- CLOUDFLARED MODE: serve shorts media from Cloudflare R2 (v0.5.0) ---
  # Read-time URL remap: DB keeps store URLs; serializers swap host for
  # shorts_cloudflare_base_url when the host matches rewrite_hosts. Off = full
  # instant rollback to the upload store.
  shorts_cloudflare_enabled:
    default: false
    client: true
  shorts_cloudflare_base_url:
    default: "https://media.renovation.reviews"
    client: true
  shorts_cloudflare_rewrite_hosts:
    type: list
    list_type: simple
    default: "renovation-reviews.storage.googleapis.com"
  # Mirror new creator uploads (video + poster) into R2 via the S3 API so the
  # remap covers them. Requires the four s3 settings below.
  shorts_cloudflare_mirror_uploads:
    default: true
  shorts_cloudflare_s3_endpoint:
    default: ""
  shorts_cloudflare_s3_bucket:
    default: "hrr-media"
  shorts_cloudflare_s3_access_key_id:
    default: ""
    secret: true
  shorts_cloudflare_s3_secret_access_key:
    default: ""
    secret: true
  # --- HRR desk (v0.9.0): the content + community automations that used to run
  # as Cowork scheduled tasks, now Sidekiq jobs in this container. All AI jobs are
  # gated on hrr_desk_enabled + a Cloudflare API token with Workers AI access.
